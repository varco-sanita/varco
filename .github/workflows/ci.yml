# SPDX-License-Identifier: EUPL-1.2
# Integrazione continua di Varco.
#
# Cosa fa: test unitari su Linux, macOS e Windows con Python 3.11 e 3.12, suite di
# conformità senza rete, validazione di publiccode.yml, audit delle dipendenze.
#
# Cosa NON fa, apposta:
#   - nessuna chiamata all'ambiente di test del MEF: i test di integrazione partono
#     solo con VARCO_INTEGRAZIONE=1, qui forzato a 0 e controllato;
#   - niente kit MEF né codice AGPL del gateway FSE: specifiche/ non è nel
#     repository, quindi i test che li usano risultano SALTATI;
#   - gli schemi HL7 (XSD del CDA, schematron del PSS) non sono nel repository: si
#     scaricano da GitHub (ministero-salute/it-fse-catalogs, commit fissato, sha256
#     verificato) con strumenti/scarica_specifiche.py --gruppi cda-xsd;
#   - nessun segreto: il workflow non legge secrets.
#
# Le azioni sono fissate per commit (non per etichetta): un'etichetta si può spostare.

name: ci

on:
  push:
  pull_request:
  schedule:
    - cron: "17 5 * * 1"   # lunedì: audit delle dipendenze anche senza modifiche
  workflow_dispatch:

permissions:
  contents: read

env:
  VARCO_INTEGRAZIONE: "0"
  PYTHONUTF8: "1"

jobs:
  test:
    name: test (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - name: Nessuna integrazione col MEF in CI
        shell: bash
        run: |
          test "$VARCO_INTEGRAZIONE" != "1" || { echo "VARCO_INTEGRAZIONE=1 vietato in CI"; exit 1; }
          test "${KITMMG_INTEGRAZIONE:-}" != "1" || { echo "KITMMG_INTEGRAZIONE=1 (alias deprecato) vietato in CI"; exit 1; }
          test ! -e specifiche || { echo "specifiche/ (kit MEF, codice AGPL) non deve stare nel repository"; exit 1; }
      - name: Installa
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"
      - name: Schemi HL7 dalla fonte ufficiale (non redistribuiti)
        run: python strumenti/scarica_specifiche.py --gruppi cda-xsd
      - name: Test unitari
        run: python -m pytest -q -rs
      - name: Suite di conformità senza rete
        run: |
          python -m varco.conformita.esegui --famiglia offline
          python -m varco.conformita.esegui --famiglia fse --validatore-fse locale

  publiccode:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.25"
          cache: false
      - name: Valida publiccode.yml
        # -no-network finché github.com/varco-sanita/varco non è pubblicato:
        # dopo la pubblicazione va tolto, così il parser controlla anche URL e logo.
        run: |
          go install github.com/italia/publiccode-parser-go/v5/publiccode-parser@v5.4.3
          "$(go env GOPATH)/bin/publiccode-parser" -no-network publiccode.yml

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Audit delle dipendenze (pip-audit)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]" pip-audit
          python -m pip freeze --exclude-editable > installati.txt
          pip-audit -r installati.txt --no-deps --disable-pip --desc
