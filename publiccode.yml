  - document-management
  - e-signature

developmentStatus: development

softwareType: library

intendedAudience:
  scope:
    - healthcare
  countries:
    - IT

description:
  it:
    localisedName: Varco
    shortDescription: >-
      Libreria aperta per i medici di medicina generale: ricetta
      dematerializzata via SAC del Sistema TS e Profilo Sanitario Sintetico
      FSE 2.0.
    longDescription: >
      Varco permette a qualsiasi programma di parlare direttamente con i
      servizi pubblici della sanità, senza passare per un gestionale
      commerciale. Implementa una volta sola, in chiaro, le specifiche
      pubbliche del Sistema Tessera Sanitaria (MEF) e del Fascicolo
      Sanitario Elettronico 2.0.


      Il modulo ricetta, dalla parte del medico prescrittore, invia al SAC la
      ricetta farmaceutica e specialistica, la visualizza, la annulla,
      gestisce il medico sostituto e la lista degli NRE utilizzati. È stato
      provato contro l'ambiente di TEST del MEF con le utenze pubbliche del
      kit di sviluppo; le chiamate verso la produzione sono bloccate in
      codice.


      Il modulo FSE genera il Profilo Sanitario Sintetico in CDA2 HL7 Italia
      a partire dagli stessi oggetti della ricetta, lo valida con il codice
      del validatore ufficiale del gateway (XSD, schematron PSS v4.0,
      vocabolari) eseguito in locale, lo allega a un PDF e lo firma PAdES.
      L'invio al gateway FSE non è ancora implementato.


      Il nome: un varco è un'apertura in una barriera. Varco non abbatte i
      cancelli dei sistemi pubblici, apre un passaggio uguale per tutti.


      Varco comprende una suite di conformità pubblica: casi in JSON con uno
      schema che li specifica, rieseguibili contro qualunque implementazione
      in qualunque linguaggio. Non contiene supporto clinico: i controlli
      locali sono solo di forma.
    # DA COMPLETARE: URL della documentazione pubblicata (oggi README.md e
    # docs/ARCHITETTURA.md nel repository).
    # documentation: ""
    features:
      - Invio della ricetta dematerializzata farmaceutica e specialistica al SAC
      - Visualizzazione e annullamento della ricetta
      - Medico sostituto e lista degli NRE utilizzati
      - Cifratura di codice fiscale e pincode con il certificato SanitelCF
      - Profilo Sanitario Sintetico FSE 2.0 in CDA2 HL7 Italia
      - Validazione con il codice del validatore ufficiale del gateway FSE
      - PDF con CDA allegato e firma PAdES
      - Suite di conformità pubblica in JSON, indipendente dal linguaggio
      - Blocco delle chiamate verso gli ambienti di produzione

